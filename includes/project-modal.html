<div class="project-modal" id="project-modal" aria-hidden="true">
  <div class="project-modal__backdrop" data-project-close></div>
  <section class="project-modal__panel" role="dialog" aria-modal="true" aria-labelledby="project-modal-title">
    <button class="project-modal__close" type="button" aria-label="Close project preview" data-project-close>&times;</button>
    <div class="project-modal__copy">
      <span class="project-modal__tag" id="project-modal-tag"></span>
      <h2 id="project-modal-title"></h2>
      <p id="project-modal-description"></p>
      <a class="project-modal__link" id="project-modal-link" target="_blank" rel="noopener">Open full project <span aria-hidden="true">&#8599;</span></a>
    </div>
    <div class="project-modal__preview">
      <iframe id="project-modal-frame" title="Project preview" loading="lazy" allowfullscreen></iframe>
    </div>
  </section>
</div>
<script>
(() => {
  const modal = document.getElementById('project-modal');
  if (!modal) return;
  const title = document.getElementById('project-modal-title');
  const tag = document.getElementById('project-modal-tag');
  const description = document.getElementById('project-modal-description');
  const link = document.getElementById('project-modal-link');
  const frame = document.getElementById('project-modal-frame');
  let opener;

  const closeModal = () => {
    modal.classList.remove('is-open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('modal-open');
    frame.src = 'about:blank';
    opener?.focus();
  };

  document.querySelectorAll('[data-project-preview]').forEach((card) => {
    card.addEventListener('click', () => {
      opener = card;
      title.textContent = card.dataset.title;
      tag.textContent = card.dataset.tag;
      description.textContent = card.dataset.description;
      link.href = card.dataset.url;
      frame.src = card.dataset.embed || card.dataset.url;
      modal.classList.add('is-open');
      modal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
      modal.querySelector('.project-modal__close').focus();
    });
  });

  modal.querySelectorAll('[data-project-close]').forEach((button) => button.addEventListener('click', closeModal));
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && modal.classList.contains('is-open')) closeModal();
  });
})();
</script>
